<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>navbar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background-color: rgb(119, 127, 163);

        }

        ul {
            list-style-type: none;
            background-color: black;
            overflow: hidden;
            display: flex;
            flex-direction: row;
        }

        li {
            margin-right: 10px;
        }

        a {
            color: #fff;
            text-decoration: none;
            display: inline-block;
            padding: 5px 10px;
            font-size: 20px;
            margin-top: 15px;

        }

        a:hover {
            background-color: yellow;
            color: #000;
        }

        .container {
            display: flex;
            justify-content: space-between;
            background-color: #000;
            /* margin: 6px; */
            padding: 6px;
        }

        .logo {
            color: white;
            font-size: 30px;
            margin-left: 12px;
        }

        .head {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 400px;
            margin-left: 100px;
 }
       #para {
            color: rgb(138, 11, 143);
            font-weight: bold;
            font-size: 20px;

        }

       
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">
            <h1>Code Academy</h1>
        </div>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Downloads</a></li>
            <li><a href="#">Gallery</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
            <li><a href="#">About</a></li>

        </ul>
    </div>
    <div class="head">
        <p id="para">Hello,I'm</p>
        <h1>Tayyeb Abdullah</h1>
        <p id="para">Frontend Developer </p>
        <p>I'm a passionate frontend developer who loves building beautiful and responsive websites.</p>
    </div>

</body>

</html>
